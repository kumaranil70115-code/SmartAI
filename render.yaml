services:
  - type: web
    name: smart-ai-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SMARTAI_CLOUD_MODE
        value: "1"
      - key: SMARTAI_KEEPALIVE
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
